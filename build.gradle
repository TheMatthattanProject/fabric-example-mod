plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"modid" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		profileSuperTnt {
			server()
			runDir "run-profile-super-tnt"
			vmArgs(
					"-Dmodid.explosionProfiling=true",
					"-Dmodid.explosionProfiling.minPower=128",
					"-Dmodid.explosionProfiling.jfr=true",
					"-Dmodid.autoProfileSuperTnt=true",
					"-Dmodid.autoProfileSuperTnt.maxTicks=6000"
			)
			programArgs "nogui"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

tasks.register("prepareProfileSuperTnt") {
	group = "fabric"
	description = "Writes EULA/server.properties for the automated Super TNT profiling run."
	outputs.upToDateWhen { false }

	doLast {
		def runDir = file("run-profile-super-tnt")
		runDir.mkdirs()

		def levelName = "profile-world"
		def levelSeed = "1046879701078950751"

		def worldDirCandidates = [
				new File(runDir, levelName),
				new File(runDir, "saves/${levelName}")
		]

		worldDirCandidates.each { dir ->
			if (!dir.exists()) {
				return
			}

			logger.lifecycle("Deleting existing world at ${dir}")
			delete(dir)
			if (dir.exists()) {
				throw new GradleException("Failed to delete existing world at ${dir}. Is a server still running?")
			}
		}

		def eulaFile = new File(runDir, "eula.txt")
		eulaFile.text = "eula=true\n"

		def propertiesFile = new File(runDir, "server.properties")
		def properties = new LinkedHashMap<String, String>()
		if (propertiesFile.exists()) {
			propertiesFile.eachLine { line ->
				def trimmed = line?.trim()
				if (!trimmed || trimmed.startsWith("#")) {
					return
				}
				int idx = trimmed.indexOf("=")
				if (idx <= 0) {
					return
				}
				def key = trimmed.substring(0, idx)
				def value = trimmed.substring(idx + 1)
				properties.put(key, value)
			}
		}

		properties.put("online-mode", "false")
		properties.put("max-tick-time", "-1")
		properties.put("level-name", levelName)
		properties.put("level-seed", levelSeed)

		propertiesFile.text = properties.collect { k, v -> "${k}=${v}" }.join("\n") + "\n"
	}
}

tasks.named("runProfileSuperTnt").configure {
	dependsOn "prepareProfileSuperTnt"
}

tasks.register("profileSuperTnt") {
	group = "fabric"
	description = "Runs a dedicated server, detonates Super TNT at spawn, logs metrics, writes a .jfr, then exits."
	dependsOn "runProfileSuperTnt"
}
